<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-css.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Brasil (simulação)</title>
    <script src="/__mock.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Aplica o tema salvo antes da primeira pintura, para a tela não piscar no tema errado.
      try {
        var t = localStorage.getItem("crm-tema");
        if (t !== "light" && t !== "dark" && t !== "glass")
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
